         sur le démarrage audio mobile) ; les deux variantes couvrent les

    <link rel="preconnect" href="https://pub-78e65d92e7574926a519b54ecff12c87.r2.dev" crossorigin />

    <meta name="theme-color" content="#ff0099" />
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />

    <link rel="manifest" href="manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./pwabuilder-adv-sw.js');
