<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vice City Radio</title>
    <!-- Connexion TLS vers le Worker audio établie dès le chargement
         (gagne ~300-600 ms sur le démarrage audio mobile) -->
    <link rel="preconnect" href="https://vcradios-audio.fusorf.workers.dev" />
    <link rel="preload" href="fonts/Pricedown%20Bl.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="fonts/SF%20Arborcrest%20Medium.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <meta name="theme-color" content="#ff0099" />
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div class="container"></div>
    <!-- Masque : noir plein écran percé d'un quadrilatère irrégulier (evenodd),
         points animés en JS à chaque changement de station -->
    <svg id="maskOverlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path id="maskPath" fill-rule="evenodd" d="M0 0 H100 V100 H0 Z" />
    </svg>
    <header class="hud">
      <img class="vc-logo" src="logos/logoVC.png" alt="Vice City" />
      <h1 class="wordmark txt-marble" data-text="Vice City Radios">Vice City Radios</h1>
    </header>
    <div id="stationTitle"></div>
    <div id="trackInfo"></div>
    <div id="stationPicker">
      <h2 class="picker-title txt-marble" data-text="Choisis ta station">Choisis ta station</h2>
      <div class="picker-grid"></div>
    </div>
    <button class="back-toggle" id="backButton" style="display: none;" title="Retour à la sélection">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#FF98E1" d="M20 9.2H11.6V4.4L3.2 12l8.4 7.6v-4.8H20Z"/></svg>
    </button>
    <button class="back-toggle" id="pauseButton" style="display: none;" title="Couper la radio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#FF98E1" d="M6.5 4.5h4v15h-4Zm7 0h4v15h-4Z"/></svg>
    </button>
    <button class="back-toggle offline-toggle" id="offlineButton" style="display: none;" title="Écoute hors ligne">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#FF98E1" d="M9.2 4h5.6v8.4h4.8L12 20l-7.6-7.6h4.8Z"/></svg>
    </button>
    <!-- Panneau de gestion des téléchargements hors ligne (PWA installée),
         rows générées par offline.js -->
    <div id="offlinePanel" style="display: none;">
      <div class="offline-sheet">
        <h2 class="offline-title txt-marble" data-text="Écoute hors ligne">Écoute hors ligne</h2>
        <div class="offline-list" id="offlineList"></div>
        <p class="offline-hint" id="offlineHint" style="display: none;">Garde l'app ouverte pendant le téléchargement</p>
        <div class="offline-footer">
          <span class="offline-total" id="offlineTotal"></span>
          <div class="offline-actions">
            <button class="offline-small-btn" id="offlineDlAll">Tout télécharger</button>
            <button class="offline-small-btn" id="offlinePurgeAll" style="display: none;">Tout supprimer</button>
          </div>
        </div>
      </div>
      <button class="back-toggle offline-close" id="offlineClose" title="Fermer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="#FF98E1" stroke-width="3" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="volume-selector" id="volumeSelector">
      <button class="volume-toggle" id="volumeToggle"></button>
      <div class="volume-menu" id="volumeMenu" style="display: none;">
        <span class="volume-value txt-marble" id="volumeValue" data-text="100%">100%</span>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100" />
      </div>
    </div>
    <script src="tracks.js"></script>
    <script src="app.js"></script>
    <script src="offline.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./pwabuilder-adv-sw.js');
        });
      }
    </script>
  </body>
</html>
